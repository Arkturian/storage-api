name: Deploy Storage API

# Push to main deploys arkserver only. Customer instances (oneal, pdrei, ELE,
# P3, ...) are NOT deployed from here: each one needs its own Go and goes out
# via tenant-update / by hand (#2583). arkturian runs no storage-api any more.
#
# arkserver is not a git checkout (see DEPLOYED_REVISION.txt there): the job
# copies the files of this commit over the live tree, the same way manual
# deploys have been done since 2026-08 (Alex' decision, 24.10.2026, #2583).

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-storage-api
  cancel-in-progress: false

env:
  LIVE_PYTHON: /var/www/api-storage.arkturian.com/venv/bin/python

jobs:
  test:
    name: Run Tests
    runs-on: [self-hosted, linux, arkserver]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # No actions/setup-python: it finds no 3.11 on the Debian 12 runner.
      # Tests run with the live venv's interpreter (same packages as
      # production, read-only use); pytest goes into a temp dir, never into
      # that venv. Data, uploads and tenant config are all in RUNNER_TEMP.
      - name: Run tests
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/storage-tests"
          rm -rf "$T" && mkdir -p "$T/pt" "$T/data" "$T/up"
          "$LIVE_PYTHON" -m pip install -q --target "$T/pt" pytest
          echo '{"ci_test_key": "arkturian"}' > "$T/tenants.json"
          PYTHONPATH="$T/pt" \
          DATABASE_URL="sqlite:///$T/t.db" \
          TENANT_CONFIG_PATH="$T/tenants.json" \
          STORAGE_DATA_DIR="$T/data" \
          STORAGE_UPLOAD_DIR="$T/up" \
            "$LIVE_PYTHON" -m pytest -q -p no:cacheprovider tests

      - name: Build release archive
        run: git archive --format=tar.gz -o "$RUNNER_TEMP/storage-api-${GITHUB_SHA}.tar.gz" "$GITHUB_SHA"

      - name: Keep archive for deploy
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: ${{ runner.temp }}/storage-api-${{ github.sha }}.tar.gz
          retention-days: 7

  deploy-arkserver:
    name: Deploy to arkserver
    needs: test
    if: vars.ENABLE_ARKSERVER_DEPLOY == 'true' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, arkserver]
    environment:
      name: production
      url: https://api-storage.arkturian.com
    steps:
      - name: Fetch release archive
        uses: actions/download-artifact@v4
        with:
          name: release
          path: release

      - name: Upload archive to host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: release/storage-api-${{ github.sha }}.tar.gz
          target: /var/tmp/storage-api-deploy
          strip_components: 1

      - name: Copy files, check, restart, verify
        uses: appleboy/ssh-action@v1.0.3
        env:
          SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: SHA
          command_timeout: 10m
          script: |
            set -euo pipefail
            LIVE=/var/www/api-storage.arkturian.com
            SHORT=${SHA:0:7}
            STAGE=/var/tmp/storage-api-deploy/$SHORT
            BACKUP=/var/backups/storage-api/$(date +%Y%m%d-%H%M%S)-$SHORT
            SERVICES="storage-api celery-worker storage-ai-worker storage-safety-worker storage-embeddings-worker"

            rm -rf "$STAGE" && mkdir -p "$STAGE"
            tar -xzf "/var/tmp/storage-api-deploy/storage-api-$SHA.tar.gz" -C "$STAGE"

            # requirements.txt on the host points mac-transcoding-api at the
            # local checkout (the PAT for the git URL is broken).
            sed -i 's|git+https://github.com/apopovic77/mac-transcoding-api.git@[a-z]*|/var/code/mac-transcoding-api|g' "$STAGE/requirements.txt"
            if ! cmp -s "$STAGE/requirements.txt" "$LIVE/requirements.txt"; then
              echo "❌ requirements.txt changed — dependency updates are done by hand (venv rebuild breaks running workers). Not deploying."
              diff "$LIVE/requirements.txt" "$STAGE/requirements.txt" || true
              exit 1
            fi

            # Syntax gate on the new tree before anything is touched.
            if ! "$LIVE/venv/bin/python" -m compileall -q -x '(^|/)(venv|\.venv|__pycache__|\.git|tests)(/|$)' "$STAGE" >/dev/null; then
              echo "❌ syntax check failed — nothing changed"
              exit 1
            fi

            # Backup of every live file this deploy overwrites.
            mkdir -p "$BACKUP"
            (cd "$STAGE" && find . -type f ! -path './tests/*' ! -path '*/__pycache__/*' -print0) | while IFS= read -r -d '' f; do
              if [ -f "$LIVE/$f" ] && ! cmp -s "$STAGE/$f" "$LIVE/$f"; then
                mkdir -p "$BACKUP/$(dirname "$f")" && cp -p "$LIVE/$f" "$BACKUP/$f"
              fi
            done
            cp -p "$LIVE/DEPLOYED_REVISION.txt" "$BACKUP/" 2>/dev/null || true
            echo "backup: $BACKUP"

            # Copy without deleting: live-only files (.env, venv, data) stay.
            # Services only read the code; root-owned 644 files are fine.
            rsync -rlt --checksum --exclude 'tests/' --exclude '.git/' --exclude '__pycache__/' "$STAGE/" "$LIVE/"

            rollback() {
              echo "⚠️  rolling back from $BACKUP"
              rsync -rlt "$BACKUP/" "$LIVE/"
              systemctl restart $SERVICES || true
            }

            systemctl restart $SERVICES
            ok=""
            for i in $(seq 1 18); do
              if curl -fsS --max-time 5 http://127.0.0.1:8080/health >/dev/null 2>&1; then ok=1; echo "health OK after ~$((i*5))s"; break; fi
              sleep 5
            done
            if [ -z "$ok" ]; then rollback; echo "❌ health check failed after 90s, rolled back"; exit 1; fi
            for s in $SERVICES; do
              systemctl is-active --quiet "$s" || { rollback; echo "❌ $s not active, rolled back"; exit 1; }
            done

            sed -i "s|^Code in this directory == storage-api origin/[a-z]* @ \([0-9a-f]*\) (|Code in this directory == storage-api origin/main @ $SHORT ($(date +%F), CI deploy; backup $BACKUP; before: \1 |" "$LIVE/DEPLOYED_REVISION.txt"
            rm -rf "$STAGE" "/var/tmp/storage-api-deploy/storage-api-$SHA.tar.gz"
            echo "✅ storage-api $SHORT live on arkserver"

  trigger-sdk-regeneration:
    name: Trigger SDK Regeneration
    needs: deploy-arkserver
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, arkserver]
    # PAT_TOKEN is known to be broken; a failed SDK trigger must not mark the
    # deploy red.
    continue-on-error: true
    steps:
      - name: Trigger C# SDK regeneration
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.PAT_TOKEN }}
          repository: apopovic77/storage-api-csharp-sdk
          event-type: openapi-updated

      - name: Trigger TypeScript SDK regeneration
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.PAT_TOKEN }}
          repository: apopovic77/storage-api-typescript-sdk
          event-type: openapi-updated
