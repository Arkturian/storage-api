name: Dev Branch CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ${{ vars.RUNNER_LABEL || 'arkserver' }}

    steps:
      - uses: actions/checkout@v4

      # No actions/setup-python: on the self-hosted Debian 12 runner it finds
      # no 3.11 in its tool cache and fails before any check runs (#2583).
      # Debian 12 ships python3.11 itself, which is what production runs on.
      - name: Python
        run: /usr/bin/python3.11 --version

      # NOTE: we intentionally do NOT `pip install -r requirements.txt` here —
      # it pulls a private git dep (mac-transcoding-api) the GitHub runner can't
      # clone, which made this CI fail on every push while testing nothing.
      # compileall doesn't import modules, so it catches syntax/indent errors
      # across the codebase without needing the dependencies installed.
      - name: Syntax / compile check
        run: /usr/bin/python3.11 -m compileall -q main.py storage tasks ai_analysis knowledge_graph tenancy admin
