name: Fix Hosts Entry (Temporary)

on:
  workflow_dispatch:

jobs:
  fix-hosts:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}

    steps:
      - name: Guard - private DEPLOY_HOST braucht self-hosted Runner
        run: |
          case "${{ secrets.DEPLOY_HOST }}" in
            10.*|192.168.*|172.1[6-9].*|172.2[0-9].*|172.3[01].*)
              if [ -z "${{ vars.RUNNER_LABEL }}" ]; then
                echo "::error::DEPLOY_HOST ist privat (${{ secrets.DEPLOY_HOST }}), RUNNER_LABEL aber leer - SSH wuerde in einen NAT-Timeout laufen."
                exit 1
              fi ;;
          esac

      - name: Add hosts entry for api-ai.arkturian.com
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            
            echo "🔧 Adding temporary hosts entry for api-ai.arkturian.com"
            
            # Check if entry already exists
            if grep -q "api-ai.arkturian.com" /etc/hosts; then
              echo "⚠️  Entry already exists in /etc/hosts"
              grep "api-ai.arkturian.com" /etc/hosts
            else
              # Add entry pointing to localhost (since AI service runs on same server)
              echo "127.0.0.1 api-ai.arkturian.com" | tee -a /etc/hosts
              echo "✅ Added hosts entry"
            fi
            
            echo ""
            echo "📋 Current /etc/hosts entries for api-ai:"
            grep "api-ai" /etc/hosts || echo "No entries found"
            
            echo ""
            echo "🔄 Restarting storage-api service..."
            systemctl restart storage-api
            
            echo ""
            echo "📊 Service status:"
            systemctl status storage-api --no-pager -l || true
            
            echo ""
            echo "✅ Done! DNS will resolve locally until propagation completes."
