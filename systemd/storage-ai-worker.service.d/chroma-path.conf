# storage-ai-worker had no CHROMA_DB_PATH and therefore fell back to the
# built-in default (config.py:36, _DATA_DIR/chroma_db) while storage-api and
# storage-embeddings-worker both point at /var/www/.../chroma_db. Two live
# vector databases side by side: whatever this worker wrote was invisible to
# the API and vice versa. Found 2026-08-18 while checking whether the old
# directory was dead — it was not, it was being written to that same hour.
[Service]
Environment=CHROMA_DB_PATH=/var/www/api-storage.arkturian.com/chroma_db
